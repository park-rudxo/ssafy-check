# Release를 발행하면 바로 설치 가능한 zip을 만들어 첨부한다.
# 사용자가 git이나 개발 도구 없이 "다운로드 → 압축 해제 → 폴더 선택"만으로
# 설치할 수 있게 하기 위함이다.
#
# 웹스토어 제출용은 요구 조건이 달라서 따로 만든다.
#  - manifest.json 이 zip 최상위에 있어야 한다 (설치용처럼 폴더로 감싸면 안 됨)
#  - 업데이트.bat / update.ps1 은 스토어에서 쓰이지 않는 Windows 실행 스크립트라
#    "확장 기능과 무관한 파일"로 심사에서 지적받을 수 있으므로 넣지 않는다
# 이건 개발자만 쓰는 파일이라 Release 에 붙이지 않고 Actions 아티팩트로 올린다.
#
# 웹스토어 쪽은 zip 을 만들지 않고 폴더째 아티팩트로 올린다. GitHub 은
# 아티팩트를 내려받을 때 항상 한 번 더 zip 으로 감싸므로, zip 을 올려두면
# 받는 사람 손에는 zip 안에 zip 이 든 파일이 떨어진다. 그걸 그대로 웹스토어에
# 올리면 "패키지에서 매니페스트를 찾을 수 없습니다" 로 거절당한다. 폴더를
# 올리면 GitHub 이 감싸주는 그 zip 자체가 곧 제출용 파일이 되어, 받아서
# 바로 올릴 수 있다. (실제로 두 번 거절당하고 나서 이렇게 바꿨다)
# Release 에 zip 을 하나 더 붙이면 "어느 걸 받아야 하는지" 혼란이 다시 생기고,
# update.ps1 이 Release 자산에서 zip 을 골라 받기 때문에 위험하다.
name: Release ZIP 첨부

on:
  release:
    types: [published, edited]
  workflow_dispatch: # 수동 실행 (최신 Release에 다시 붙이고 싶을 때)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 버전 확인
        id: v
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      # 붙일 Release 를 여기서 한 번만 정한다. 아래 검사와 마지막 업로드가
      # 같은 값을 봐야, 검사에서 통과한 것과 실제로 붙는 곳이 갈라지지 않는다.
      - name: 대상 Release 확인
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          # 수동 실행일 때는 최신 Release에 붙인다.
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          fi
          echo "대상 Release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # ── 태그와 manifest 버전이 같은지 확인한다 ──────────────────────────
      # 실제로 일어난 사고: v1.14.0 릴리스를 만들었는데 태그가 머지 전 커밋을
      # 가리키고 있었다. checkout 은 릴리스 이벤트에서 그 태그를 받아오므로,
      # 액션은 계속 그 커밋의 manifest(1.17.0)로 빌드했다. 릴리스 본문을 몇 번
      # 고쳐 올려도 태그가 안 움직이니 결과는 그대로였고, 아무 데서도 오류가
      # 나지 않아 "왜 몇 번을 해도 그대로냐"로만 보였다.
      #
      # 더 나쁜 것은 그 zip 이 웹스토어에 올라가는 경우다. 한 번 올린 버전보다
      # 낮은 번호는 다시 올릴 수 없어서, 돌이킬 방법이 없다.
      #
      # 그래서 빌드하기 전에 끊는다. 태그 이름과 지금 체크아웃된 manifest 의
      # 버전이 다르면 그 자리에서 실패시키고, 무엇을 해야 하는지까지 적는다.
      - name: 태그와 manifest 버전이 같은지 확인
        env:
          VERSION: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "::error::붙일 Release 를 찾지 못했습니다. Release 를 먼저 만들어주세요."
            exit 1
          fi
          # v 만 빠진 경우를 따로 잡는다. 그러지 않으면 "태그(1.14.0)와 버전
          # (1.14.0)이 다릅니다" 라는, 읽고도 뭘 고치라는 건지 알 수 없는
          # 문구가 나간다.
          if [ "$TAG" = "$VERSION" ]; then
            echo "::error::태그 이름은 v 로 시작해야 합니다. $TAG 가 아니라 v${VERSION} 입니다."
            exit 1
          fi
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "::error::태그($TAG)와 manifest 버전(${VERSION})이 다릅니다."
            echo "::error::태그가 가리키는 커밋이 올리려는 커밋이 아닙니다 (보통 머지 전 커밋에 태그가 박힌 경우)."
            echo "::error::고치는 법 - Release 를 태그까지 함께 지우고 Target 을 main 으로 다시 만들거나,"
            echo "::error::            git tag -f $TAG origin/main && git push -f origin $TAG 로 태그를 옮긴 뒤 Release 를 다시 저장하세요."
            exit 1
          fi
          echo "태그와 버전이 일치합니다: $TAG"

      - name: 확장 파일만 모아 zip 생성
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          EXT_FILES="manifest.json background.js content.js content.css debug.js
                     holidays.js mattermost.js build-target.js popup.html popup.js
                     welcome.html welcome.css welcome.js"

          # 두 빌드는 같은 소스에서 나온다. 차이는 아래에서 주는 것뿐이다.
          mkdir -p dist/webstore dist/ssafy-check
          for d in dist/webstore dist/ssafy-check; do
            cp $EXT_FILES "$d/"
            cp -r icons "$d/"
          done

          # 파일을 새로 추가하고 위 목록에 넣는 것을 잊으면, zip 은 멀쩡히
          # 만들어지지만 설치할 때 크롬이 "파일을 읽을 수 없습니다"로 거부한다.
          # (debug.js 가 실제로 그렇게 빠진 적이 있다.) manifest 가 가리키는
          # 파일이 빌드에 다 들어갔는지 여기서 확인한다.
          node -e '
            const fs = require("fs");
            let bad = 0;
            for (const dir of ["dist/webstore", "dist/ssafy-check"]) {
              const m = JSON.parse(fs.readFileSync(dir + "/manifest.json", "utf8"));
              const refs = [m.background && m.background.service_worker];
              for (const cs of m.content_scripts || []) refs.push(...(cs.js || []), ...(cs.css || []));
              for (const p of Object.values(m.icons || {})) refs.push(p);
              if (m.action && m.action.default_popup) refs.push(m.action.default_popup);
              // 확장 페이지(popup/welcome)가 부르는 스크립트·스타일도 같이 본다.
              // 이쪽은 크롬이 설치는 시켜주고 화면만 조용히 망가진다.
              for (const f of fs.readdirSync(dir).filter((f) => f.endsWith(".html"))) {
                const html = fs.readFileSync(dir + "/" + f, "utf8");
                for (const [, p] of html.matchAll(/(?:src|href)="([^":]+)"/g)) refs.push(p);
              }
              for (const p of new Set(refs.filter(Boolean))) {
                if (!fs.existsSync(dir + "/" + p)) {
                  console.error(`::error::${dir} 에 ${p} 가 없습니다. EXT_FILES 에 추가하세요.`);
                  bad++;
                }
              }
            }
            if (bad) process.exit(1);
          '

          # ── 웹스토어 빌드에만 주는 차이 ──────────────────────────────
          # 1) 업데이트 UI 를 끈다. 크롬이 알아서 갱신하고, 업데이트.bat 이
          #    들어 있지도 않아서 그걸 실행하라는 안내가 남으면 안 된다.
          echo 'self.BUILD_TARGET = "webstore";' > dist/webstore/build-target.js
          # 2) 릴리스 확인을 하지 않으므로 GitHub 호스트 권한을 뺀다.
          #    권한이 줄면 심사도, 설치 시 사용자에게 보이는 안내도 깔끔해진다.
          node -e '
            const fs = require("fs");
            const p = "dist/webstore/manifest.json";
            const m = JSON.parse(fs.readFileSync(p, "utf8"));
            delete m.host_permissions;
            fs.writeFileSync(p, JSON.stringify(m, null, 2) + "\n");
          '

          # 웹스토어 제출용은 여기서 zip 으로 묶지 않는다. dist/webstore 를
          # 폴더째 아티팩트로 올리고, GitHub 이 내려받을 때 감싸주는 zip 을
          # 그대로 제출한다. (위 머리말 참고)

          # 설치용은 압축을 풀면 폴더 하나가 나오도록 감싸고, 그 폴더만
          # 더블클릭으로 갱신할 수 있게 업데이트 도구를 함께 넣는다.
          cp 업데이트.bat update.ps1 dist/ssafy-check/
          ( cd dist && zip -r "$GITHUB_WORKSPACE/ssafy-check-v${VERSION}.zip" ssafy-check )

          # 웹스토어 빌드에 업데이트 도구나 GitHub 권한이 새어 들어가면
          # 심사에서 지적받으므로, 빌드가 조용히 잘못되지 않도록 여기서 막는다.
          if find dist/webstore -name '업데이트.bat' -o -name 'update.ps1' | grep -q .; then
            echo "::error::웹스토어 빌드에 업데이트 도구가 들어갔습니다."; exit 1
          fi
          # optional_host_permissions 도 이름에 host_permissions 를 품고 있어
          # grep 으로는 구분되지 않는다. 키를 직접 확인한다.
          node -e '
            const m = require("./dist/webstore/manifest.json");
            if (m.host_permissions) {
              console.error("::error::웹스토어 manifest 에 host_permissions 가 남아 있습니다.");
              process.exit(1);
            }
          '
          if ! grep -q 'BUILD_TARGET = "webstore"' dist/webstore/build-target.js; then
            echo "::error::웹스토어 빌드 표시가 적용되지 않았습니다."; exit 1
          fi

          echo "── 설치용 ──"
          unzip -l "ssafy-check-v${VERSION}.zip"
          echo "── 웹스토어 제출용 (이 파일들이 내려받은 zip 의 최상위에 놓인다) ──"
          ( cd dist/webstore && find . -type f | sort )

      # path 에 zip 파일이 아니라 폴더를 준다. 이렇게 해야 내려받은 zip 의
      # 최상위에 manifest.json 이 놓여 웹스토어에 그대로 올릴 수 있다.
      # zip 파일을 주면 zip 안에 zip 이 들어가 거절당한다.
      - name: 웹스토어 제출용 파일을 아티팩트로 올리기
        uses: actions/upload-artifact@v4
        with:
          name: webstore-v${{ steps.v.outputs.version }}
          path: dist/webstore/
          if-no-files-found: error

      - name: Release에 첨부
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # GitHub 은 "Source code (zip)" 를 항상 자동으로 붙이고 숨길 수 없다.
          # 사용자가 그걸 잘못 받는 일이 실제로 있었으므로, 파일명 대신
          # 표시될 라벨(#뒤 텍스트)을 붙여 어느 쪽을 받아야 하는지 분명히 한다.
          # 라벨은 화면 표시용이라 실제 파일명과 update.ps1 의 *.zip 매칭에는
          # 영향을 주지 않는다.
          ZIP="ssafy-check-v${VERSION}.zip"
          gh release upload "$TAG" \
            "${ZIP}#⬇️ 설치용 파일 — 이걸 받으세요 (${ZIP})" --clobber
