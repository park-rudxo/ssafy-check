# Release를 발행하면 바로 설치 가능한 zip을 만들어 첨부한다.
# 사용자가 git이나 개발 도구 없이 "다운로드 → 압축 해제 → 폴더 선택"만으로
# 설치할 수 있게 하기 위함이다.
name: Release ZIP 첨부

on:
  release:
    types: [published, edited]
  workflow_dispatch: # 수동 실행 (최신 Release에 다시 붙이고 싶을 때)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 버전 확인
        id: v
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: 확장 파일만 모아 zip 생성
        run: |
          set -euo pipefail
          # 크롬은 manifest.json이 zip 최상위에 있어야 폴더로 인식한다.
          mkdir -p dist/ssafy-check
          cp manifest.json background.js content.js content.css \
             popup.html popup.js welcome.html welcome.css welcome.js \
             dist/ssafy-check/
          cp -r icons dist/ssafy-check/
          cd dist
          zip -r "../ssafy-check-v${{ steps.v.outputs.version }}.zip" ssafy-check
          cd ..
          unzip -l "ssafy-check-v${{ steps.v.outputs.version }}.zip"

      - name: Release에 첨부
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          # 수동 실행일 때는 최신 Release에 붙인다.
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          fi
          echo "대상 Release: $TAG"
          gh release upload "$TAG" \
            "ssafy-check-v${{ steps.v.outputs.version }}.zip" --clobber
